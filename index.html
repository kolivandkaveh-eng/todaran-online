/* --- رابط کاربری بازچینی‌شده برای موبایل و تبلت --- */
:root{--u:1}
.b{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 14px #0006,inset 0 1px 0 #ffffff30;border-color:#ffffff55;font-weight:700}
#top{gap:5px;max-width:calc(100vw - var(--sl) - var(--sr));flex-wrap:wrap;justify-content:flex-start}
#top .b{width:clamp(34px,5.2vh,42px);height:clamp(34px,5.2vh,42px);font-size:clamp(15px,2.5vh,18px);flex:0 0 auto}
#hud{padding:7px 9px;border:1px solid #ffffff26;border-radius:14px;background:linear-gradient(145deg,#101820bb,#10182055);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
#mm{width:clamp(72px,15vh,100px);height:clamp(72px,15vh,100px);margin-top:5px}
#joy{width:clamp(100px,19vh,132px);height:clamp(100px,19vh,132px);background:radial-gradient(circle,#ffffff20,#10182080);box-shadow:0 4px 18px #0006,inset 0 0 18px #ffffff12}
#kn{background:radial-gradient(circle at 35% 30%,#fff,#c9d6e5aa);border:2px solid #ffffffa0;box-shadow:0 3px 10px #0008}
.b{min-width:48px}
#act{background:linear-gradient(145deg,#ffd36e,#e8a33d);border:2px solid #fff9;color:#211605;font-size:clamp(14px,2.4vh,18px)}
#jump,#gas{bottom:calc(var(--sb) + clamp(82px,15vh,104px));}
#run,#brk{bottom:calc(var(--sb) + 4px);}
#stl,#str{bottom:calc(var(--sb) + 8px);width:clamp(48px,8vh,62px);height:clamp(48px,8vh,62px)}
#spd{padding:4px 14px;border-radius:14px;background:#1018209c;border:1px solid #ffffff26;font-size:clamp(18px,4vh,26px)}
#toast{max-width:85vw;backdrop-filter:blur(8px);box-shadow:0 6px 24px #0008}
#pnl{border:1px solid #ffffff30;box-shadow:0 12px 40px #0009}
#ld{background:radial-gradient(ellipse at 50% 0%,#31556a 0,#172432 44%,#080c12 100%)}
#ld>button,#ld>div button{box-shadow:0 5px 18px #0005}
@media (orientation:landscape){
  #top{top:calc(var(--st) + 2px);right:var(--sr);left:auto;gap:4px;max-width:52vw;flex-wrap:nowrap}
  #top .b{width:clamp(32px,5.5vh,42px);height:clamp(32px,5.5vh,42px)}
  #hud{top:calc(var(--st) + 2px);left:var(--sl);max-width:24vw;font-size:clamp(10px,1.8vh,13px)}
  #mm{width:clamp(64px,13vh,88px);height:clamp(64px,13vh,88px)}
  #joy{left:calc(var(--sl) + 4px);bottom:calc(var(--sb) + 5px)}
  #act{right:calc(var(--sr) + 4px);bottom:calc(var(--sb) + 5px);width:clamp(60px,12vh,76px);height:clamp(60px,12vh,76px)}
  #jump,#gas{right:calc(var(--sr) + 8px);bottom:calc(var(--sb) + clamp(76px,14vh,94px))}
  #run,#brk{right:calc(var(--sr) + clamp(72px,14vh,94px));bottom:calc(var(--sb) + 8px)}
  #stl{left:calc(var(--sl) + clamp(110px,20vh,142px));bottom:calc(var(--sb) + 8px)}
  #str{left:calc(var(--sl) + clamp(162px,29vh,202px));bottom:calc(var(--sb) + 8px)}
  #spd{bottom:calc(var(--sb) + 2px);font-size:clamp(18px,4vh,25px)}
}
@media (max-height:420px) and (orientation:landscape){
  :root{--st:4px;--sb:5px;--sl:7px;--sr:7px}
  .b{width:46px;height:46px}
  #joy{width:94px;height:94px}
  #hud{padding:4px 6px}
  #mm{width:58px;height:58px}
  #top .b{width:31px;height:31px;font-size:14px}
  #act{width:58px;height:58px}
  #jump,#gas{bottom:64px}
}
@media (orientation:portrait){
 #rot{z-index:100}
}

#kn{

const tmp={look:null,tried:new Set()};
const curLook=()=>tmp.look||look();
const dirty=()=>!!tmp.look&&JSON.stringify(norm(tmp.look))!==JSON.stringify(norm(look()));
const cart=()=>tmp.look?wornIds(tmp.look).filter(id=>tmp.tried.has(id)&&!shopState().owned.includes(id)).map(id=>ITEMS[id]):[];
const cartTotal=()=>cart().reduce((a,x)=>a+price(x),0);
function startTry(){if(!tmp.look){const l=norm(look());tmp.look=l}}
function tryItem(id){
  const it=ITEMS[id];if(!it)return;startTry();const l=tmp.look;
  if(id.startsWith('set_')){l.set=id;l.top=null;l.pants=null}
  else if(id.startsWith('top_')){l.set=null;l.top=id}
  else if(id.startsWith('pants_')){l.set=null;l.pants=id}
  else setK(l,it);
  tmp.tried.add(id);applyTo(HP,l);previewCam();toast('👗 پرو: '+it.n+' (هنوز نخریدی)');lastKey='';
}
function untryItem(id){
  const it=ITEMS[id];if(!it||!tmp.look)return;const l=tmp.look,sv=norm(look());
  if(id.startsWith('set_'))l.set=sv.set;else if(id.startsWith('top_'))l.top=sv.top;else if(id.startsWith('pants_'))l.pants=sv.pants;
  else unsetK(l,sv,it);
  tmp.tried.delete(id);
  if(!dirty()){tmp.look=null;tmp.tried.clear()}
  applyTo(HP,curLook());lastKey='';
}
function cancelTry(){tmp.look=null;tmp.tried.clear();applyTo(HP,look());lastKey=''}

// چرخش دوربین به جلوی بازیکن تا لباس را ببیند
let pv=null;
function previewCam(){try{if(typeof Y==='undefined')return;pv={t:0,a0:Y,x:P.x,z:P.z,tar:P.rot+Math.PI};if(!pv.run){pv.run=1;requestAnimationFrame(pvTick)}}catch(e){pv=null}}
let pvLast=0;
function pvTick(now){
  if(!pv)return;const dt=Math.min(.05,(now-(pvLast||now))/1000);pvLast=now;
  if(Math.hypot(P.x-pv.x,P.z-pv.z)>.4||V){pv=null;pvLast=0;return}
  pv.t+=dt;
  if(pv.t<.5)Y=lerpA(Y,pv.tar,Math.min(1,dt*9));
  else if(pv.t>2.4&&pv.t<3.1)Y=lerpA(Y,pv.a0,Math.min(1,dt*7));
  else if(pv.t>=3.1){pv=null;pvLast=0;return}
  requestAnimationFrame(pvTick);
}

const inside=()=>{const dx=P.x-BX,dz=P.z-BZ;return Math.abs(dx)<BW/2-.3&&dz>-BD/2+.3&&dz<BD/2-.2};
const okUi=()=>started&&!paused&&!V&&!D.body.classList.contains('hmOn');
function stationNear(){let b=null,bd=2.3;for(const s of ST){const d=Math.hypot(P.x-(BX+s.x),P.z-(BZ+s.z));if(d<bd){bd=d;b=s}}return b?{type:'st',s:b,d:bd}:null}
function cashierNear(){const d=Math.hypot(P.x-(BX+CX),P.z-(BZ+CZ-1.6));return d<2.1?{type:'cs',d}:null}
function nearest(){const a=stationNear(),c=cashierNear();return c&&(!a||c.d<=a.d)?c:a}
function renderTry(n){
  const cnt=cart().length;let key,html;
  if(n&&n.type==='cs'){key='cs'+cnt+tmp.tried.size;html=`<b>🧾 صندوق بوتیک</b><small>${cnt?fa(cnt)+' مورد در سبد · '+fa(cartTotal())+' تومان':'سبدت خالیه · 🔥 '+fa(Object.keys(SALE).length)+' آیتم تخفیف‌دار امروز'}</small><div class="row"><button data-a="cat">📖 کاتالوگ</button><button data-a="pay" ${(cnt||dirty())?'':'disabled'}>💳 پرداخت</button></div>`}

function renderCo(msg){
  const items=cart(),tot=items.reduce((a,x)=>a+price(x),0),bal=Number(S.money)||0,free=!items.length,ok=bal>=tot;
  coBox.innerHTML=`<h3>🧾 فاکتور بوتیک</h3>`+
   (free?`<div class="mbl"><span>تغییر ظاهر (بدون هزینه)</span><span>۰ تومان</span></div>`:items.map(x=>`<div class="mbl"><span>${x.ic} ${x.n}</span><span>${fa(price(x))} تومان ${saleTxt(x)}<button data-rm="${x.id}">✕</button></span></div>`).join(''))+
   `<div class="mbt"><span>جمع کل</span><b>${fa(tot)} تومان</b></div>`+
   `<div class="mbl"><span>موجودی شما</span><span>${fa(bal)} تومان</span></div>`+
   (free?'':`<div class="mbl"><span>${ok?'باقی‌مانده بعد از خرید':'کمبود موجودی'}</span><span style="color:${ok?'#9be39b':'#ff8a8a'}">${fa(ok?bal-tot:tot-bal)} تومان</span></div>`)+
   (msg?`<div class="mbm">${msg}</div>`:'')+
   `<div class="mba"><button data-a="pay" ${ok?'':'disabled'}>${free?'✅ ذخیره ظاهر':'✅ تأیید و پرداخت'}</button><button data-a="back">↩ ادامه خرید</button><button data-a="cancel" class="x">✖ لغو خرید</button></div>`;
}
function openCo(){
  if(coOpen||paused)return;if(!dirty()&&!cart().length){toast('🧺 چیزی برای پرداخت نیست؛ جلوی لباس‌ها «پرو» بزن');return}
  coOpen=true;paused=true;coWrap.style.display='flex';renderCo('');
}
function closeCo(){coOpen=false;coWrap.style.display='none';paused=false;tbKey='';lastKey=''}
function doPay(){
  if(busy||!coOpen)return;busy=true;
  try{
    if(!tmp.look){closeCo();return}
    const items=cart(),tot=items.reduce((a,x)=>a+price(x),0),money=Number(S.money)||0;
    if(tot>0&&money<tot){renderCo('💸 موجودی کافی نیست؛ پولی از حسابت کم نشد.');return}
    const q=shopState();
    S.money=money-tot;
    for(const x of items)if(!q.owned.includes(x.id))q.owned.push(x.id);
    q.look=Object.assign({},tmp.look);
    tmp.look=null;tmp.tried.clear();
    applyTo(HP,look());tags.forEach(f=>f());
    try{save()}catch(e){}
    closeCo();
    toast(tot>0?'🛍️ خرید انجام شد: '+fa(tot)+' تومان کم شد و لباس‌ها ذخیره شدند':'✅ ظاهر جدید ذخیره شد');
  }finally{busy=false}
}
function backIn(){P.x=BX;P.z=BZ+BD/2-2.2;P.y=gh(P.x,P.z);P.vy=0;P.rot=Math.PI;wasIn=true;pendingExit=false}
coWrap.addEventListener('click',e=>{
  const rm=e.target.closest('[data-rm]');if(rm){e.stopPropagation();untryItem(rm.dataset.rm);if(!dirty()&&!cart().length){closeCo();toast('🧺 سبد خالی شد؛ پولی کم نشد')}else renderCo('');return}
  const b=e.target.closest('button');if(!b)return;e.stopPropagation();
  const a=b.dataset.a;
  if(a==='pay')doPay();
  else if(a==='back'){closeCo();if(!inside())backIn()}
  else if(a==='cancel'){cancelTry();closeCo();toast('✖ خرید لغو شد؛ پولی کم نشد')}
});

  if(!inn&&!hinted&&ok&&near(BX,BZ+BD/2+3)<16){hinted=true;toast('🛍️ وارد بوتیک شو؛ جلوی هر لباس بایست و «پرو» را بزن')}

 const excluded=b=>!b||b.closest('#btn-custom-panel,#pnl,#mn,#iv,#settings,#menu')||b.id==='ivn'||b.id==='ivy'||b.matches('input,select,textarea');
 const SEL='button,[role=button],[onclick],[data-action],[tabindex]:not([tabindex="-1"]),#joy,#kn,#act,.b,.hud-button,.control-button,#top>*,#companion-main-toggle';
 const targets=()=>document.querySelectorAll(SEL);
 const isTarget=e=>{const t=e?.closest?.(SEL);return t&&!excluded(t)?t:null};
 function key(b){if(!b.dataset.customKey)b.dataset.customKey=b.id||('custom_'+(++counter)+'_'+(b.textContent||'').trim().slice(0,12));return b.dataset.customKey}
 function read(){try{return JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){return {}}}
 function apply(b){if(excluded(b))return;let d=read()[key(b)];if(!d)return;b.style.setProperty('position','fixed','important');b.style.setProperty('left',d.x+'px','important');b.style.setProperty('top',d.y+'px','important');b.style.setProperty('right','auto','important');b.style.setProperty('bottom','auto','important');b.style.setProperty('transform','none','important');if(d.scale)b.style.setProperty('scale',String(d.scale),'important')}
 function all(){targets().forEach(apply)}
 function savePos(b){let o=read(),r=b.getBoundingClientRect();o[key(b)]={x:Math.max(0,Math.min(innerWidth-r.width,r.left)),y:Math.max(0,Math.min(innerHeight-r.height,r.top)),scale:parseFloat(b.dataset.customScale||'1')};localStorage.setItem(STORE,JSON.stringify(o))}
 function panel(){let p=$('btn-custom-panel');if(p)p.remove();p=document.createElement('div');p.id='btn-custom-panel';p.innerHTML='<b>🎮 شخصی‌سازی دکمه‌ها</b><p style="margin:8px 0">مثل کانتر، تمام دکمه‌ها و کنترل‌های قابل لمس بازی (بالا، پایین، چپ، راست، دکمه‌های مأموریت و کنترل حرکت) را یکی‌یکی بگیر و هر جای صفحه خواستی بگذار؛ برای تغییر اندازه اول انتخابش کن.</p><div id="bc-selected">دکمه‌ای انتخاب نشده</div><div style="margin-top:8px"><button id="bc-sm">− کوچک‌تر</button><button id="bc-lg">＋ بزرگ‌تر</button></div><div style="margin-top:8px"><button id="bc-reset">بازنشانی همه</button><button class="primary" id="bc-done">ذخیره و پایان</button></div>';document.body.appendChild(p);
 $('bc-sm').onclick=()=>scale(.9);$('bc-lg').onclick=()=>scale(1.1);$('bc-reset').onclick=()=>{if(confirm('جای همه دکمه‌ها و اندازه‌ها به حالت اولیه برگردد؟')){localStorage.removeItem(STORE);targets().forEach(b=>{b.style.removeProperty('position');b.style.removeProperty('left');b.style.removeProperty('top');b.style.removeProperty('right');b.style.removeProperty('bottom');b.style.removeProperty('transform');b.style.removeProperty('scale');delete b.dataset.customScale});finish();T_.customize()}};$('bc-done').onclick=finish;
 }
 function scale(f){if(!selected)return;let s=Math.max(.6,Math.min(1.8,(parseFloat(selected.dataset.customScale)||1)*f));selected.dataset.customScale=s;selected.style.setProperty('scale',String(s),'important');let o=read();o[key(selected)]={...(o[key(selected)]||{}),x:selected.getBoundingClientRect().left,y:selected.getBoundingClientRect().top,scale:s};localStorage.setItem(STORE,JSON.stringify(o));label()}
 function label(){let e=$('bc-selected');if(e)e.textContent=selected?'انتخاب‌شده: '+(selected.textContent||selected.id||'دکمه').trim().slice(0,30):'دکمه‌ای انتخاب نشده'}
 function down(e){if(!active)return;let b=isTarget(e.target);if(!b)return;e.preventDefault();e.stopImmediatePropagation();selected=b;label();let r=b.getBoundingClientRect();drag={b,dx:e.clientX-r.left,dy:e.clientY-r.top};b.setPointerCapture?.(e.pointerId)}
 function move(e){if(!active||!drag)return;e.preventDefault();let b=drag.b,x=Math.max(0,Math.min(innerWidth-b.offsetWidth,e.clientX-drag.dx)),y=Math.max(0,Math.min(innerHeight-b.offsetHeight,e.clientY-drag.dy));b.style.setProperty('position','fixed','important');b.style.setProperty('left',x+'px','important');b.style.setProperty('top',y+'px','important');b.style.setProperty('right','auto','important');b.style.setProperty('bottom','auto','important');b.style.setProperty('transform','none','important')}
 function up(){if(drag){savePos(drag.b);drag=null}}
 function finish(){active=false;document.body.classList.remove('btn-customizing');document.removeEventListener('pointerdown',down,true);document.removeEventListener('pointermove',move,true);document.removeEventListener('pointerup',up,true);document.removeEventListener('pointercancel',up,true);$('btn-custom-panel')?.remove();selected=null}
 const customizeFn=()=>{if(active)return;active=true;all();document.body.classList.add('btn-customizing');panel();document.addEventListener('pointerdown',down,true);document.addEventListener('pointermove',move,true);document.addEventListener('pointerup',up,true);document.addEventListener('pointercancel',up,true);};
 window.__customize=customizeFn;const _iv=setInterval(()=>{if(window.T_){window.T_.customize=customizeFn;clearInterval(_iv)}},200);
 all();new MutationObserver(()=>all()).observe(document.body,{childList:true,subtree:true});
})();

<style id="mobile-all-controls-fix">
/* Mobile HUD: keep every gameplay control reachable on phone screens */
@media (max-width: 760px), (max-height: 520px) {
  html, body { width:100%; height:100%; overflow:hidden; overscroll-behavior:none; touch-action:manipulation; }
  button, [role="button"], .b, .hud-button, .control-button { max-width: min(42vw, 190px); box-sizing:border-box; font-size:clamp(10px, 2.8vw, 14px); padding:clamp(5px,1.6vw,9px) clamp(7px,2vw,12px); }
  #joy, #kn, #act { max-width:32vw; max-height:32vw; touch-action:none; }
  #top { max-width:100vw; box-sizing:border-box; }

}

  #top { gap:4px; flex-wrap:wrap; }

<style id="phone-controls-and-scroll-fix">
/* Phone mode: do not block the game in portrait orientation */
@media (max-width: 760px) {
  #rot { display:none !important; }
  html, body {
    width:100%; min-height:100%; height:auto; overflow-x:hidden; overflow-y:auto;
    overscroll-behavior-y:contain; touch-action:pan-y;
  }
  /* Leave a real scroll range for touch scrolling; the game canvas stays fixed. */
  body::after { content:""; display:block; height:38vh; min-height:180px; pointer-events:none; }
  #cv, #cam, #cv canvas { position:fixed; inset:0; }
  #top {
    top:max(5px,env(safe-area-inset-top)); right:max(5px,env(safe-area-inset-right));
    left:max(5px,env(safe-area-inset-left)); max-width:none; width:auto;
    gap:3px; flex-wrap:wrap; justify-content:flex-start;
  }
  #top .b { width:clamp(30px,8vw,38px)!important; height:clamp(30px,8vw,38px)!important; min-width:0!important; font-size:clamp(12px,3.5vw,16px)!important; }
  .b {
    width:clamp(42px,11vw,54px)!important; height:clamp(42px,11vw,54px)!important;
    min-width:0!important; font-size:clamp(10px,2.8vw,13px)!important;
    padding:2px!important; touch-action:none;
  }
  #act { width:clamp(54px,14vw,68px)!important; height:clamp(54px,14vw,68px)!important; }
  #joy { width:clamp(82px,23vw,112px)!important; height:clamp(82px,23vw,112px)!important; touch-action:none; }
  #jump,#gas { right:calc(var(--sr) + 2px); bottom:calc(var(--sb) + 70px); }
  #run,#brk { right:calc(var(--sr) + 58px); bottom:calc(var(--sb) + 4px); }
  #stl { left:var(--sl); bottom:calc(var(--sb) + 4px); }
  #str { left:calc(var(--sl) + 48px); bottom:calc(var(--sb) + 4px); }
  #hud { max-width:34vw; font-size:10px; padding:4px 5px; }
  #mm { width:clamp(48px,13vw,68px); height:clamp(48px,13vw,68px); }
  #spd { font-size:18px; }
  #btn-custom-panel { width:calc(100vw - 16px); max-height:72dvh; overflow-y:auto; touch-action:pan-y; }
  #pnl,#ph,#ch,#mnl,#mncs { max-height:78dvh; overflow-y:auto; touch-action:pan-y; }
}
/* Keep swipe scrolling available on empty gameplay areas while controls remain tappable. */
@media (max-width: 760px) {
  #cv canvas { touch-action:pan-y; }
  #joy,.b,#top,.control-button,.hud-button { touch-action:none; }
}
</style>

<script id="ref-layout-js">
/* ===== اتصال چیدمان مرجع به منطق موجود بازی (بدون دست‌زدن به بقیهٔ کد) ===== */
(function(){
'use strict';
var D=document;
function $(i){return D.getElementById(i)}
function ce(t,c,x){var e=D.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}

/* ۱) پاک‌کردن ایموجی ابتدای سطرهای HUD؛ آیکون‌ها با CSS می‌آیند */
var LEAD=/^[^\u0600-\u06FFA-Za-z0-9\u06F0-\u06F9\(«"'«]+/u;
function watch(el,fix){
  if(!el)return;
  var o=new MutationObserver(function(){o.disconnect();try{fix(el)}catch(e){}o.observe(el,{childList:true,characterData:true,subtree:true})});
  try{fix(el)}catch(e){}
  o.observe(el,{childList:true,characterData:true,subtree:true});
}
function plain(el){
  if(el.children.length)return;
  var t=el.textContent,n=t.replace(LEAD,'').trim();
  if(n!==t)el.textContent=n;
}
function botRow(el){
  if(el.querySelector('.rf-h')&&el.dataset.rfRaw===el.textContent)return;
  var raw=el.textContent;
  var m=/^\s*(?:🙂|😊)\uFE0F?\s*(.*?)\s*(?:❤|♥)\uFE0F?\s*([0-9\u06F0-\u06F9]+)\s*$/u.exec(raw);
  if(!m){el.classList.remove('rf-smile');return}
  el.classList.add('rf-smile');
  while(el.firstChild)el.removeChild(el.firstChild);
  el.appendChild(ce('span','rf-t',m[1]));
  var h=ce('span','rf-h');h.appendChild(ce('i'));h.appendChild(ce('b','',m[2]));
  el.appendChild(h);
  el.dataset.rfRaw=el.textContent;
}

/* ۲) ساخت/برچسب‌زنی دکمه‌های ستون چپ */
function btnFace(b,cls,label,iconCls,iconFirst){
  b.classList.add('rf-lb');cls.split(' ').forEach(function(c){c&&b.classList.add(c)});
  b.textContent='';
  var s=ce('span','rf-s',label),i=ce('i','rf-i '+iconCls);
  if(iconFirst){b.appendChild(i);b.appendChild(s)}else{b.appendChild(s);b.appendChild(i)}
}
function stop(b){b.addEventListener('pointerdown',function(e){e.stopPropagation()})}

var cam=null,vit=null;
function ensureOwn(){
  if(!cam){
    cam=ce('button');cam.id='rf-cam';cam.type='button';
    btnFace(cam,'rf-row','دوربین','rf-i-cam',false);
    cam.onclick=function(){try{window.T_&&window.T_.xSelfie&&window.T_.xSelfie()}catch(e){}};
    stop(cam);D.body.appendChild(cam);
  }
  if(!vit){
    vit=ce('button');vit.id='rf-vit';vit.type='button';
    btnFace(vit,'rf-col','حیاتی','rf-i-med',true);
    vit.onclick=function(){vit.classList.toggle('on',D.body.classList.toggle('vit-on'))};
    stop(vit);D.body.appendChild(vit);
  }
}
var side=0;
function adopt(){
  ensureOwn();
  var hpb=$('hpb');
  if(hpb&&hpb.parentNode!==D.body)D.body.appendChild(hpb);
  var bs=D.querySelectorAll('body>button');
  for(var k=0;k<bs.length;k++){
    var b=bs[k];
    if(b.dataset.rfDone)continue;
    var t=b.textContent||'';
    if(b.id==='companion-main-toggle'){
      btnFace(b,'rf-col','تعویض همراه','rf-i-swap',true);b.title='تعویض همراه اصلی (آرین / xz)';b.dataset.rfDone='1';
    }else if(t.indexOf('تعمیر ماشین')>-1){
      b.classList.add('rf-lb','rf-row','rf-tea');b.dataset.rfDone='1';
    }else if(/xz:\s*(همراهمه|بمون)/.test(t)){
      b.classList.add('rf-lb','rf-side');b.dataset.rfDone='1';
    }else if(t.indexOf('حیحی')>-1){
      b.classList.add('rf-lb','rf-side','rf-side2');b.dataset.rfDone='1';
    }
  }
  /* وقتی کسی نیاز به احیا دارد، پنل حیاتی خودکار باز شود */
  var rv=D.querySelector('#hpb .hpx');
  if(rv){
    var need=rv.style.display==='block';
    if(need&&!adopt.shown){D.body.classList.add('vit-on');vit&&vit.classList.add('on');adopt.shown=true}
    else if(!need)adopt.shown=false;
  }
}
function init(){
  watch($('mo'),plain);watch($('ck'),plain);watch($('bh'),botRow);
  adopt();setInterval(adopt,400);
  new MutationObserver(function(){adopt()}).observe(D.body,{childList:true});
}
/* #bh را خود بازی بعداً می‌سازد؛ تا ساخته شود منتظر می‌مانیم */
var tries=0;(function wait(){
  if($('mo')&&$('ck')){init();
    (function bw(){if($('bh'))watch($('bh'),botRow);else if(++tries<200)setTimeout(bw,300)})();
  }else if(++tries<200)setTimeout(wait,100)})();
})();

</script>

<script id="todaran-snapp-apps">
(()=>{'use strict';
const T=window.T_; if(!T||!T.phApp)return;
const APP={request:null,driverOnline:false,job:null,ride:null,timer:null,dispatchTimer:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MAX_FARE=2000000; // سقف کرایهٔ تخمینی سفر در بازی به تومان
const MAX_WAIT=15,rndWait=()=>5+Math.random()*(MAX_WAIT-5); // رسیدن راننده/مسافر: بین ۵ تا حداکثر ۱۵ ثانیه
const busy=()=>APP.job||(APP.ride&&APP.ride.status!=='completed');
function incoming(){if(APP.incomingTimer){clearTimeout(APP.incomingTimer);APP.incomingTimer=null}APP.incomingAt=0;if(!APP.driverOnline||busy())return;const W=rndWait()*1000;APP.incomingAt=Date.now()+W;APP.incomingTimer=setTimeout(()=>{APP.incomingTimer=null;APP.incomingAt=0;if(!APP.driverOnline||busy())return;const l=destinations(),d=l[Math.floor(Math.random()*l.length)];if(!d){incoming();return}let p;try{p=T.phPosition()}catch(e){p={x:0,z:0}}if(!p||!Number.isFinite(p.x)||!Number.isFinite(p.z))p={x:0,z:0};const near=l.filter(q=>q!==d&&Math.hypot(q.x-p.x,q.z-p.z)>40).sort((a,b)=>Math.hypot(a.x-p.x,a.z-p.z)-Math.hypot(b.x-p.x,b.z-p.z)).slice(0,5),o=near.length?near[Math.floor(Math.random()*near.length)]:{x:p.x+60,z:p.z,n:'کنار جاده'};APP.ride={dest:d,origin:{x:o.x,z:o.z},originName:o.n,status:'waiting',created:Date.now(),fare:calcFare(Math.hypot(d.x-o.x,d.z-o.z)),driver:null,auto:true};if(document.querySelector('#phb .snapp-driver-head'))driver()},W)}
setInterval(()=>{const e=$('snappEta');if(!e)return;const r=APP.ride,pas=r&&r.eta&&(r.status==='waiting'||r.status==='accepted'),t=pas?r.eta:APP.incomingAt,n=t?Math.ceil((t-Date.now())/1000):0;e.textContent=n>0?(pas?'راننده تا حدود ':'مسافر تا حدود ')+n.toLocaleString('fa-IR')+' ثانیه دیگر می‌رسد':''},1000);
const calcFare=(dist)=>Math.min(MAX_FARE,Math.max(60000,Math.round(60000+dist*2500)));
const money=n=>Math.round(n).toLocaleString('fa-IR')+' تومان';
const destinations=()=>{try{return typeof T.phPlaces==='function'?T.phPlaces():[]}catch(e){return []}};
function destinationsHtml(){const a=destinations();return a.map((p,i)=>'<option value="'+i+'">'+esc(p.n)+'</option>').join('')}
function appHome(){const b=$('phb');if(!b)return;const g=b.querySelector('.pha');if(!g)return;
 if(!$('snappPassengerIcon')){const x=document.createElement('button');x.id='snappPassengerIcon';x.innerHTML='<i class="snapp-logo">S</i><span>اسنپ</span>';x.onclick=()=>T.snappApp('passenger');g.insertBefore(x,g.firstChild)}
 if(!$('snappDriverIcon')){const x=document.createElement('button');x.id='snappDriverIcon';x.innerHTML='<i class="snapp-logo driver">S</i><span>اسنپ رانندگان</span>';x.onclick=()=>T.snappApp('driver');g.insertBefore(x,g.firstChild)}
}
function shell(title,body){$('phb').innerHTML='<div class="snapp-shell"><header><button onclick="T_.snappBack()">‹</button><b>'+title+'</b><span class="snapp-mark">snapp</span></header>'+body+'</div>'}
function passenger(){const opts=destinationsHtml();const r=APP.ride;let status='خودروهای نزدیک آماده خدمت هستند.';if(r){if(r.status==='waiting')status='درخواست ثبت شد؛ در حال پیدا کردن راننده…';else if(r.status==='accepted')status='✅ راننده '+esc(r.driver?.name||'نزدیک')+' سفر را قبول کرد؛ خودرو: '+esc(r.driver?.car||'')+' | پلاک: '+esc(r.driver?.plate||'');else if(r.status==='arrived')status='🚕 تاکسی رسید؛ در حال سوار شدن…';else if(r.status==='ontrip')status='🛣️ سفر شما شروع شده؛ در مسیر مقصد هستید.';else if(r.status==='completed')status='🎉 سفر با موفقیت تمام شد.';}shell('اسنپ | درخواست خودرو','<div class="snapp-hero"><div class="snapp-car">🚕</div><h2>کجا می‌خوای بری؟</h2><p>مبدا از موقعیت فعلی داخل بازی ثبت می‌شود.</p></div><label>مقصد سفر</label><select id="snappDest" '+(r&&r.status!=='completed'?'disabled':'')+'>'+opts+'</select><div class="snapp-info"><span>مبدا: موقعیت فعلی</span><b id="snappFare">کرایه بر اساس مسیر</b></div>'+(r&&r.status!=='completed'?'':'<button class="snapp-primary" onclick="T_.snappRequest()">درخواست تاکسی</button>')+'<div id="snappPassengerStatus" class="snapp-status">'+status+'</div><div id="snappEta" class="snapp-status"></div>'+(r&&(r.status==='waiting'||r.status==='accepted')?'<button class="snapp-secondary" onclick="T_.snappCancel()">لغو درخواست</button>':'') );
 const sel=$('snappDest');if(sel){sel.addEventListener('change',()=>updateFare());updateFare()}}
function updateFare(){const sel=$('snappDest'),el=$('snappFare');if(!sel||!el)return;const d=destinations()[+sel.value];if(!d)return;const p=T.phPosition();const dist=Math.hypot(d.x-p.x,d.z-p.z);el.textContent='کرایه تقریبی: '+money(calcFare(dist))+' (حداکثر ۲٬۰۰۰٬۰۰۰ تومان)'}
function request(){if(APP.ride&&APP.ride.status!=='completed'){passenger();return}const sel=$('snappDest'),list=destinations(),d=list[+(sel?sel.value:0)];if(!d){const st=$('snappPassengerStatus');if(st)st.textContent='مقصدی برای سفر پیدا نشد؛ نقشه بازی را بررسی کنید.';return}let p;try{p=T.phPosition()}catch(e){p={x:0,z:0}}if(!p||!Number.isFinite(p.x)||!Number.isFinite(p.z)){p={x:0,z:0}}APP.job=null;const W=rndWait()*1000;APP.ride={dest:d,origin:{x:p.x,z:p.z},status:'waiting',created:Date.now(),fare:calcFare(Math.hypot(d.x-p.x,d.z-p.z)),driver:null,eta:Date.now()+W};passenger();const st=$('snappPassengerStatus');if(st)st.textContent='درخواست ثبت شد؛ در حال پیدا کردن راننده…';if(APP.dispatchTimer)clearTimeout(APP.dispatchTimer);if(APP.driverOnline){APP.dispatchTimer=setTimeout(()=>{if(APP.ride&&APP.ride.status==='waiting')driver()},500)}else{APP.dispatchTimer=setTimeout(autoDriverAccept,Math.min(3000,W*.4))}}
function autoDriverAccept(){if(!APP.ride||APP.ride.status!=='waiting')return;const names=['امیر','آرمان','محمد','پارسا','کیان','سامان','علی','ماهان'];const plates=['۲۱ الف ۴۵۶ ایران ۶۸','۳۴ ب ۷۸۹ ایران ۲۲','۵۶ ج ۱۲۳ ایران ۴۴','۱۸ د ۶۷۸ ایران ۳۳'];const pick=a=>a[Math.floor(Math.random()*a.length)];const rd=APP.ride;rd.status='accepted';rd.driver={name:pick(names),car:'سمند زرد (تاکسی)',plate:pick(plates)};passenger();
const rp=()=>{if($('snappPassengerStatus'))passenger()};let ok=false;
try{ok=T.taxiCall({x:rd.dest.x,z:rd.dest.z,n:rd.dest.n},rd.eta,rd.fare,{onArrive(){if(APP.ride===rd){rd.status='arrived';rp()}},onBoard(){if(APP.ride===rd){rd.status='ontrip';rp();toast('🗣️ بزرگ آرین: دارم چیت می‌زنم، سریع‌تر بریم');setTimeout(()=>{if(APP.ride===rd&&rd.status==='ontrip')toast('🗣️ بزرگ آرین: چیتم کار کرد')},1000)}},onDone(){if(APP.ride===rd){rd.status='completed';rp()}}})}catch(e){}
if(!ok){APP.ride=null;passenger()}}
function cancel(){if(APP.ride&&(APP.ride.status==='arrived'||APP.ride.status==='ontrip'))return;try{T.taxiAbort()}catch(e){}if(APP.dispatchTimer)clearTimeout(APP.dispatchTimer);APP.dispatchTimer=null;APP.ride=null;APP.job=null;passenger()}
function driver(){shell('اسنپ رانندگان','<div class="snapp-driver-head"><div class="snapp-driver-logo">S</div><div><b>پنل راننده</b><p>سفرهای داخل شهر توداران</p></div></div><div class="snapp-online"><span>وضعیت فعالیت</span><button class="'+(APP.driverOnline?'on':'')+'" onclick="T_.snappToggle()">'+(APP.driverOnline?'آنلاین ●':'آفلاین ○')+'</button></div><div class="snapp-earn"><small>درآمد این سفر</small><b>'+money(APP.job?APP.job.fare:0)+'</b></div><div id="snappDriverJobs">'+(APP.ride&&APP.ride.status==='waiting'?'<div class="snapp-job"><b>درخواست سفر جدید</b><p>مقصد: '+esc(APP.ride.dest.n)+'</p><p>کرایه: '+money(APP.ride.fare)+'</p><button class="snapp-primary" onclick="T_.snappAccept()">قبول سفر</button></div>':APP.job?'<div class="snapp-job"><b>سفر فعال</b><p>'+(APP.job.status==='pickup'&&APP.job.originName?'مسافر در: '+esc(APP.job.originName)+'</p><p>':'')+'مقصد: '+esc(APP.job.dest.n)+'</p><p id="snappFar" style="color:#c0392b"></p><p>وضعیت: '+(APP.job.status==='pickup'?'حرکت به سمت مسافر':'مسافر سوار شد؛ حرکت به مقصد')+'</p><button class="snapp-primary" onclick="T_.snappJobAction()">'+(APP.job.status==='pickup'?'رسیدم؛ سوار شد':'پایان سفر')+'</button></div>':'<div class="snapp-status">'+(APP.driverOnline?'در انتظار درخواست سفر… <b id="snappEta"></b>':'برای دریافت سفر، آنلاین شو.')+'</div>')+'</div>');}
function toggle(){APP.driverOnline=!APP.driverOnline;if(!APP.driverOnline&&APP.ride&&APP.ride.auto&&APP.ride.status==='waiting')APP.ride=null;incoming();driver()}
function accept(){if(!APP.ride||!APP.driverOnline)return;APP.ride.status='accepted';APP.job={dest:APP.ride.dest,origin:APP.ride.origin,originName:APP.ride.originName,fare:APP.ride.fare,status:'pickup'};try{T.paxSpawn(APP.job.origin.x,APP.job.origin.z)}catch(e){}try{T.phClose();T.phSetRoute(APP.job.origin.x,APP.job.origin.z,APP.job.originName?'مسافر: '+APP.job.originName:'مبدا مسافر')}catch(e){}driver();}
function jobAction(){if(!APP.job)return;if(APP.job.status==='pickup'){let q;try{q=T.phPosition()}catch(e){q=null}if(q&&Math.hypot(q.x-APP.job.origin.x,q.z-APP.job.origin.z)>16){const f=$('snappFar');if(f)f.textContent='هنوز به مسافر نرسیدی؛ مسیر روی نقشه رو دنبال کن.';return}if(APP.job.boarding)return;APP.job.boarding=1;const go=()=>{if(!APP.job)return;APP.job.boarding=0;APP.job.status='dropoff';try{T.phSetRoute(APP.job.dest.x,APP.job.dest.z,APP.job.dest.n)}catch(e){}if($('phb')&&document.querySelector('#phb .snapp-driver-head'))driver()};try{T.phClose()}catch(e){}if(T.paxBoard)T.paxBoard(go);else go();return}const fare=APP.job.fare;try{T.phFinishRide(fare)}catch(e){}try{T.paxRemove()}catch(e){}APP.job=null;APP.ride=null;APP.driverOnline=true;incoming();driver()}
function back(){if(APP.job||APP.ride)driver();else T.phApp('home')}
T.snappApp=mode=>mode==='driver'?driver():passenger();T.snappBack=back;T.snappRequest=request;T.snappCancel=cancel;T.snappToggle=toggle;T.snappAccept=accept;T.snappJobAction=jobAction;
const style=document.createElement('style');style.textContent=`
#phb .pha button{position:relative}#phb .snapp-logo{display:flex!important;align-items:center;justify-content:center;width:40px;height:40px;margin:0 auto 4px;border-radius:12px;background:#00b894;color:white;font:bold 29px Arial;font-style:normal;box-shadow:0 3px 9px #0003}#phb .snapp-logo.driver{background:#063f32;color:#21d6a0}
.snapp-shell{width:100%;height:100%;overflow:auto;background:#f5f7f7;color:#172321;padding:12px;box-sizing:border-box;font-family:inherit}.snapp-shell header{display:flex;align-items:center;gap:12px;margin-bottom:18px}.snapp-shell header button{border:0;background:#e3ece9;border-radius:12px;font-size:26px;width:40px;height:40px}.snapp-mark{margin-right:auto;color:#00a878;font:bold 20px Arial}.snapp-hero{background:#e2f8ef;border-radius:18px;padding:16px;text-align:center;margin-bottom:18px}.snapp-car{font-size:48px}.snapp-shell h2{margin:6px 0}.snapp-shell p{color:#62716d;font-size:13px;margin:6px 0}.snapp-shell label{display:block;margin:10px 0 6px;font-weight:bold}.snapp-shell select{width:100%;padding:13px;border:1px solid #d3dfdb;border-radius:12px;background:white;font:inherit;color:#172321}.snapp-info,.snapp-online{display:flex;justify-content:space-between;align-items:center;padding:14px 2px;margin:10px 0;border-bottom:1px solid #e1e8e5;font-size:13px}.snapp-primary,.snapp-secondary{width:100%;border:0;border-radius:13px;padding:14px;margin-top:12px;font:inherit;font-weight:bold}.snapp-primary{background:#00b878;color:white}.snapp-secondary{background:#e8efec;color:#31413c}.snapp-status{background:#edf3f1;padding:14px;border-radius:12px;margin-top:14px;font-size:13px;line-height:1.8}.snapp-driver-head{display:flex;gap:14px;align-items:center;background:#e1f7ed;padding:16px;border-radius:16px}.snapp-driver-logo{width:54px;height:54px;border-radius:15px;background:#064638;color:#27d9a1;display:grid;place-items:center;font:bold 38px Arial}.snapp-online button{border:0;border-radius:30px;padding:10px 18px;background:#dfe6e3;color:#40504b;font:inherit}.snapp-online button.on{background:#00b878;color:white}.snapp-earn{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:14px;padding:15px;margin:14px 0}.snapp-earn b{color:#009d6a;font-size:19px}.snapp-job{background:white;border-radius:16px;padding:16px;margin-top:12px;box-shadow:0 3px 12px #0001}.snapp-job p{padding:4px 0}
`;document.head.appendChild(style);
const mo=new MutationObserver(()=>{if($('phb')&&$('phb').querySelector('.pha'))appHome()});if($('phb'))mo.observe($('phb'),{childList:true,subtree:true});
const old=T.phApp;T.phApp=function(a){old(a);if(a==='home')setTimeout(appHome,0)};
})();

</script>
